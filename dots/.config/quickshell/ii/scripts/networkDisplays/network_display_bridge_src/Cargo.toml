[package]
name = "network_display_bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
zbus = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures-util = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
