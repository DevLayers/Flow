# Source colors + current wallpaper ($background_image), both regenerated by
# matugen on every wallpaper change. Colors come from config.toml's
# [templates.hyprlock]; $background_image is the real current image path.
source = ~/.config/hypr/hyprlock/colors.conf

general {
    ignore_empty_input = true
    hide_cursor = false
    immediate_render = true
    fractional_scaling = 2
}

# Smooth lock/unlock fade. (grace — instant dismiss on suspend — is passed via
# the `-g`/`--grace` CLI flag by the lock launcher, not the config file.)
animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 2, linear
    animation = fadeOut, 1, 2, linear
}

# ─────────────────────────────────────────────────────────────────────────────
# Tide lock — Apple-grade, wallpaper-adaptive. Deep-blurred wallpaper, a light
# clock in the upper third (Inter, matching the shell), and a restrained unlock
# cluster in the lower third: name + a frosted translucent password pill. Colors
# come from matugen (colors.conf) so the lock tracks the wallpaper like the shell.
# ─────────────────────────────────────────────────────────────────────────────

background {
    monitor =
    # Live wallpaper: $background_image is the REAL current image (rewritten by
    # matugen into hyprlock/colors.conf). hyprlock blurs it itself via
    # blur_passes/blur_size, so the lock screen is never a stale pre-blurred PNG
    # — it always tracks whatever wallpaper is set, from any path.
    path = $background_image
    color = rgba(0, 0, 0, 1.0)     # shown until the wallpaper is available
    blur_size = 6
    blur_passes = 3
    noise = 0.015
    contrast = 1.05
    brightness = 0.55              # dim so the light glass + text read cleanly
    vibrancy = 0.20
    vibrancy_darkness = 0.10
}

# ── Upper third: time ────────────────────────────────────────────────────────
# Big, light-weight clock — the shell's own clock language, scaled up.
label {
    monitor =
    text = cmd[update:1000] date '+%-I:%M'
    color = rgba(ffffffff)
    font_size = 116
    font_family = Inter SemiBold
    position = 0, 300
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(00000066)
    shadow_boost = 1.1
}

# Date — quiet, directly under the clock.
label {
    monitor =
    text = cmd[update:60000] date '+%A, %B %-d'
    color = rgba(ffffffcc)
    font_size = 20
    font_family = Inter Medium
    position = 0, 210
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(00000055)
}

# ── Lower third: unlock cluster ──────────────────────────────────────────────
# Frosted password pill — translucent fill + hairline outline (glass, like the
# shell's controls), refined circular dots, adaptive check/fail/caps colors.
input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(ffffff1f)     # frosted glass fill (~12% white)
    font_color = rgba(ffffffff)
    outer_color = rgba(ffffff30)     # hairline ring (~19% white)
    rounding = 27                    # full pill
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa">Enter Password</span>
    check_color = $primary           # authenticating — wallpaper accent
    fail_color = $error
    capslock_color = $tertiary       # caps-lock warning tint
    fail_text = <span foreground="##ffb4ab">$FAIL ($ATTEMPTS)</span>
    position = 0, -240
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000055)
    shadow_boost = 1.0
}
